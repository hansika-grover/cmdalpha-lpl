# Sentinel synthetic world. Every rate in playbook section 9 lives here.
# Same seed -> byte-identical files in data/world/.
seed: 7
start_date: "2024-10-01"
months: 24

population:
  households: 20000
  advisors: 250
  advisor_book_min: 40
  advisor_book_max: 120
  age_min: 55
  age_max: 95
  age_mean: 72          # weighted toward 65-80
  age_sd: 8
  assets_median: 350000
  assets_sigma: 1.05     # log-normal spread
  assets_min: 25000
  assets_max: 10000000
  trusted_contact_rate: 0.72
  poa_at_start_rate: 0.10
  poa_at_start_rate_over_80: 0.22

normal_money:
  systematic_withdrawal_rate: 0.68     # share of households with a monthly withdrawal
  systematic_annual_pct: [0.03, 0.055] # of assets per year
  rmd_age: 73
  rmd_pct: 0.04
  lumpy_per_year: [1, 3]
  lumpy_median_pct_assets: 0.025
  lumpy_sigma: 0.9
  new_payees_per_year: [2, 4]
  sale_of_long_held_rate: 0.25         # lumpy withdrawals funded by selling a 5y+ holding
  lumpy_to_new_business: 0.30          # contractor, dealer, hospital...
  lumpy_to_new_individual: 0.15        # private contractor, family member, private car sale
  renovation_burst_rate: 0.30          # home repairs paid in 2-3 instalments to the same payee
  cancelled_rate: 0.01

account_change_rates_per_year:          # per household per year
  password_reset: 0.30
  new_device: 0.20
  email_change: 0.08
  phone_change: 0.06
  address_change: 0.05
  bank_link_added: 0.05
  poa_added: 0.02
  poa_added_over_80: 0.045
  trusted_contact_changed: 0.04
  trusted_contact_removed: 0.01

notes:
  per_year: [2, 8]
  no_notes_rate: 0.15
  withdrawal_note_rate: 0.55            # a note accompanies a lumpy withdrawal request
  benign_risky_mention_rate: 0.03       # normal notes mentioning crypto, Facebook, etc.
  injection_rate: 0.01                  # prompt-injection text planted in notes (cases and normals)
  styles: [terse, standard, verbose, abbreviated, typo_prone]

exploitation:
  household_rate: 0.02                  # over 24 months; realistic rate for reweighting below
  realistic_base_rate: 0.005
  first_case_day: 90                    # leave history before any case starts
  last_case_day: 680
  loss_scam_median: 33500               # FinCEN median, scams
  loss_scam_sigma: 0.80                 # gives ~6-10% of cases above $100k
  loss_theft_median: 23800              # FinCEN median, trusted-person theft
  loss_theft_sigma: 0.95
  max_loss_share_of_assets: 0.85
  coached_cover_story_rate: 0.15
  typologies:
    investment_romance_scam:
      share: 0.30
      perpetrator: stranger
      p_red_flag_notes: 0.72
      p_new_payee: 0.65
      p_crypto: 0.50
      p_test_transfer: 0.60
      p_bank_link: 0.40
      p_sell_long_held: 0.45
    tech_support_impersonation:
      share: 0.20
      perpetrator: stranger
      p_red_flag_notes: 0.60
      p_password_reset: 0.70
      p_new_device: 0.70
      p_new_payee: 0.60
      p_crypto: 0.25
      p_sell_long_held: 0.30
    government_impersonation:
      share: 0.10
      perpetrator: stranger
      p_red_flag_notes: 0.65
      p_new_payee: 0.55
      p_crypto: 0.20
      p_sell_long_held: 0.40
    silent_account_takeover:
      share: 0.15
      perpetrator: stranger
      p_red_flag_notes: 0.20
      p_email_change: 0.80
      p_phone_change: 0.50
      p_new_device: 0.80
      p_bank_link: 0.85
      p_sell_long_held: 0.35
    grandparent_voice_clone:
      share: 0.05
      perpetrator: stranger
      p_red_flag_notes: 0.65
      p_new_payee: 0.65
      p_crypto: 0.15
      p_sell_long_held: 0.20
    trusted_person_theft:
      share: 0.20
      perpetrator: trusted
      p_red_flag_notes: 0.60
      p_poa_added: 0.60
      p_joint_owner_added: 0.25
      p_tc_changed: 0.30
      p_structuring: 0.35

lookalikes:
  household_rate_per_year: 0.025        # ~1,000 legitimate look-alike episodes over 24 months
  p_explaining_note: 0.60
  kinds:
    home_purchase: 0.16
    gift_to_family: 0.16
    long_term_care_deposit: 0.10
    car_purchase: 0.12
    large_tax_payment: 0.10
    remarriage: 0.05
    moving_states: 0.13
    transfer_to_other_firm: 0.10
    trust_funding: 0.08
